services:
  php:
    # Construction à partir du stage 'prod' du Dockerfile.
    # Ce stage est minimal, sécurisé et contient le code optimisé.
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: prod
    image: waffle-app:prod
    container_name: waffle-app-prod
    # Durcissement (Beta6 audit FIX-01 #13) : le conteneur ne tourne plus root
    # (cf. la stage 'prod' du Dockerfile — utilisateur non-root dédié), le
    # système de fichiers racine est immuable au runtime, et l'escalade de
    # privilèges via setuid/setgid est désactivée.
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    # CRITIQUE : pas de bind-mount ni de volume persistant en production ! Le
    # code applicatif reste immuable, figé dans l'image. `read_only: true`
    # couvre TOUT le système de fichiers racine, y compris les dossiers que
    # FrankenPHP/Caddy doivent pouvoir écrire (état Caddy sous
    # XDG_CONFIG_HOME=/config et XDG_DATA_HOME=/data — cf. le Dockerfile —,
    # ainsi que var/cache et var/log si un adaptateur fichier est un jour
    # configuré) : les seules entrées ci-dessous sont donc des tmpfs éphémères
    # (jamais persistés au redémarrage), en mode 1777 posé explicitement — le
    # mode par défaut d'un tmpfs Docker n'est PAS garanti world-writable
    # (vérifié : sans ce réglage, Caddy échoue avec « permission denied » sous
    # l'utilisateur non-root dédié). Ce mode s'écrit en octal, `0o1777` :
    # Compose lit un `1777` nu comme un nombre décimal, soit 0o3361, et
    # l'utilisateur non-root ne peut alors rien écrire dans ces dossiers — les
    # workers échouent au démarrage, faute de pouvoir créer la racine des
    # uploads (var/uploads).
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0o1777
      - type: tmpfs
        target: /config
        tmpfs:
          mode: 0o1777
      - type: tmpfs
        target: /data
        tmpfs:
          mode: 0o1777
      - type: tmpfs
        target: /app/var
        tmpfs:
          mode: 0o1777
    # Variables d'environnement de production.
    environment:
      # Utiliser le vrai nom de domaine (transmis via variable d'environnement, sinon localhost).
      SERVER_NAME: ${SERVER_NAME:-localhost}
      APP_ENV: prod
      APP_DEBUG: false
      # En production réelle, les secrets doivent être injectés via la CI/CD ou Docker Secrets.
      APP_SECRET: ${APP_SECRET:-ChangeMeInProduction}
      # Arrêt gracieux sans hook preStop (OPS-02) : à SIGTERM, /readyz répond 503 pendant
      # ce délai, puis Caddy ferme ses ports et draine l'en-cours (cf. docker/frankenphp/Caddyfile).
      CADDY_SHUTDOWN_DELAY: ${CADDY_SHUTDOWN_DELAY:-5s}
    # Docker tue le conteneur 10 s après SIGTERM par défaut : laisser shutdown_delay (5 s)
    # puis grace_period (25 s) s'écouler avant le SIGKILL.
    stop_grace_period: 35s
    # Exposition des ports.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Politique de redémarrage en production.
    restart: always
