services:
  php:
    # Construction à partir du stage 'dev' du Dockerfile.
    # Ce stage inclut Composer, Xdebug et un utilisateur non-root.
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: dev
    image: waffle-app:dev
    container_name: waffle-app-dev
    # En développement, le dossier local est monté sur /app.
    # Cela permet le « hot reload » et de coder sans rebuild.
    volumes:
      - ./:/app
    # Variables d'environnement de développement.
    environment:
      SERVER_NAME: localhost
      APP_ENV: dev
      APP_DEBUG: true
      # Activation du débogage pas-à-pas et de la couverture Xdebug.
      XDEBUG_MODE: debug,coverage
    # Exposition HTTP (80), HTTPS (443) et HTTP/3 (443 UDP).
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Conservation interactive du conteneur.
    tty: true
    # L'application se connecte à PostgreSQL et à Redis via leurs noms de service
    # (DB_HOST, REDIS_DSN) : on attend qu'ils soient réellement prêts (healthcheck)
    # avant de démarrer — sans Redis, le cache du routeur empêche le kernel d'amorcer.
    depends_on:
      waffle-postgres:
        condition: service_healthy
      waffle-redis:
        condition: service_healthy

  # Redis — cache PSR-16 (`waffle.cache.*`, via Predis) et état partagé entre tous les
  # workers : seaux du limiteur de débit (NET-01) et circuits du disjoncteur (NET-03),
  # via phpredis. L'application s'y connecte via REDIS_DSN=redis://waffle-redis:6379 ;
  # le port 6379 est aussi exposé sur l'hôte pour les sondes manuelles (redis-cli).
  waffle-redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: waffle-redis
    ports:
      - "6379:6379"
    healthcheck:
      # Ping de diagnostic pour valider l'état du serveur Redis.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Base de données PostgreSQL — persistance relationnelle (RFC-022).
  # L'application s'y connecte via le nom de service (DB_HOST=waffle-postgres) ;
  # le port 5432 est aussi exposé sur l'hôte pour les sondes manuelles (psql, IDE).
  waffle-postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: waffle-postgres
    environment:
      # Identifiants de développement local (résolus depuis .env) —
      # surchargés par l'orchestrateur en production.
      POSTGRES_DB: "${DB_NAME:-waffle}"
      POSTGRES_USER: "${DB_USER:-waffle}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-waffle}"
    ports:
      - "5432:5432"
    volumes:
      # Volume nommé : les données survivent aux redémarrages du conteneur.
      - waffle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready valide que le serveur accepte réellement les connexions.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-waffle} -d ${DB_NAME:-waffle}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  waffle-postgres-data:
