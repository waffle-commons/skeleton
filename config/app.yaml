# Configuration principale de l'application Waffle.
waffle:
  # Environnement applicatif (dev, prod, test). Renseigné par la variable d'environnement serveur.
  env: '%env(APP_ENV)%'
  # Secret racine de l'application (APP_SECRET), 32 octets ou plus. La clé CSRF en
  # dérive (HKDF-SHA256) quand security.csrf.secret est vide ; sans l'un ni l'autre,
  # la production refuse de démarrer. Le secret du pont d'authentification
  # (auth.secret), partagé avec d'autres services, n'en dérive jamais.
  secret: '%env(APP_SECRET)%'
  # Durcissement sécurité : hôtes de confiance.
  # Liste des domaines autorisés. Si vide, tous les hôtes sont acceptés (DEV uniquement).
  # En PROD, ce paramètre DOIT être renseigné pour prévenir l'injection d'en-tête Host.
  trusted_hosts:
    - localhost
  # Sondes d'orchestrateur (OPS-01, RFC-023) : /healthz (vivacité) et /readyz
  # (disponibilité). Une sonde listée ici est indispensable : absente ou en échec,
  # l'instance répond 503 sur /readyz et Kubernetes cesse de lui router du trafic.
  health:
    required:
      - db.pool
    # Arrêt gracieux (OPS-02, RFC-023 §5.1) : le hook preStop du pod crée ce fichier
    # puis patiente ; tant qu'il existe, /readyz répond 503 alors que PHP sert encore
    # le reste du trafic. Ensuite SIGTERM, et le grace_period de Caddy draine l'en-cours.
    # Sans hook preStop (Docker, Compose…), CADDY_SHUTDOWN_DELAY fait la même bascule
    # côté Caddy, à SIGTERM (docker/frankenphp/Caddyfile).
    drain_marker: '/tmp/waffle-draining'
  security:
    # Niveau de durcissement de l'INTÉGRITÉ DES OBJETS résolus (échelle cumulative
    # Level1 → Level10, RFC-002), appliquée par le SecureContainer à chaque service
    # qu'il instancie. Couche DISTINCTE du contrôle d'accès aux routes, lequel est
    # porté par les attributs #[Voter] (ABAC fail-closed, AUTHZ-01) — il n'y a pas
    # d'attribut #[Rule]. 10 = toutes les règles cumulées (le plus strict).
    level: 10
    csrf:
      # Clé de signature des jetons CSRF HMAC sans état (Beta-1 / SEC-01), 32 octets
      # ou plus, résolue depuis l'env WAFFLE_CSRF_SECRET. Facultative : vide, elle
      # dérive de waffle.secret (APP_SECRET), la même dans chaque worker. En prod, une
      # valeur trop courte, ou ni l'une ni l'autre, avorte le boot.
      secret: '%env(WAFFLE_CSRF_SECRET)%'
    # CORS fail-closed (SEC-04) : liste blanche d'origines exactes
    # (scheme://host[:port]). Vide par défaut ⇒ toute requête cross-origin est
    # refusée. Ajoutez vos origines front-end pour l'ouvrir ; jamais « * » avec
    # des cookies/identifiants (rejeté à la construction de CorsPolicy).
    cors:
      allowed_origins: []
    # Protection SSRF (SEC-02) : le client HTTP sortant résout chaque hôte,
    # épingle l'IP validée (CURLOPT_RESOLVE, anti-rebinding) et refuse toute
    # adresse privée / loopback / réservée. `allowed_hosts` est la liste blanche
    # d'hôtes internes de confiance (noms exacts ou CIDR, ex. « legacy-backend »
    # ou « 10.0.0.0/8 ») exemptés du contrôle. Vide par défaut ⇒ posture stricte ;
    # n'y placez QUE des backends que vous maîtrisez.
    ssrf:
      allowed_hosts: []
    # Limitation de débit (NET-01, RFC-017 §3.1) : seau à jetons partagé dans Redis
    # (jamais en mémoire du worker), compté par sujet authentifié, sinon par IP
    # cliente. `capacity` requêtes par `period_seconds`, rafales comprises.
    # `on_storage_failure` : open (laisse passer, journalisé) ou closed (503).
    # `trusted_proxies` : adresses ou plages CIDR dont on lit X-Forwarded-For (vide ⇒
    # REMOTE_ADDR seul). /healthz, /readyz et /waffle-metrics passent avant, hors quota.
    rate_limit:
      enabled: true
      capacity: 120
      period_seconds: 60
      on_storage_failure: 'open'
      trusted_proxies: []
      redis_dsn: '%env(REDIS_DSN)%'    # redis://[:mot-de-passe@]hôte[:port]
  # Client HTTP sortant (NET-02/03, RFC-024). Une clé absente prend la valeur par
  # défaut du contrat.
  http_client:
    # Délais de chaque transfert, jamais infinis : 1 à 30000 ms pour la connexion,
    # 1 à 120000 ms au total. Reprises des seules méthodes idempotentes (GET, HEAD,
    # OPTIONS, PUT, DELETE, sauf `retry_non_idempotent`), sur échec réseau ou
    # 429/502/503/504, avec un recul exponentiel à gigue complète plafonné à
    # `max_delay_ms` ; un Retry-After peut dépasser ce plafond, et aucune attente
    # ne démarre au-delà de `budget_ms`. `max_attempts: 1` coupe les reprises.
    resilience:
      connect_timeout_ms: 1000
      total_timeout_ms: 10000
      max_attempts: 3
      base_delay_ms: 100
      max_delay_ms: 2000
      budget_ms: 15000
      retry_non_idempotent: false
    # Disjoncteur par origine (schéma, hôte, port), état partagé dans Redis : il
    # s'ouvre quand `failure_rate_percent` % des appels échouent (réseau ou 5xx) sur
    # `window_seconds`, à partir de `minimum_calls` appels ; ouvert, il répond 503
    # sans connexion. Après `cool_down_seconds`, il laisse passer `half_open_trials`
    # appel(s) d'essai : un succès le referme. Redis indisponible : il laisse
    # passer, avec un avertissement et une métrique.
    breaker:
      enabled: true
      failure_rate_percent: 50
      minimum_calls: 10
      window_seconds: 60
      cool_down_seconds: 30
      half_open_trials: 1
      redis_dsn: '%env(REDIS_DSN)%'    # redis://[:mot-de-passe@]hôte[:port]
  # Pont d'Authentification Universel (RFC-021, paquet waffle-commons/auth).
  auth:
    # Secret partagé du pont (HMAC-SHA256) : signe les assertions d'identité
    # X-Wfl-Assert-User et valide les JWT HS256 de la démo. 32 octets minimum —
    # absent ou trop court ⇒ avortement du boot en production (principe
    # fail-closed, RFC-021 §4.2). NE COMMITTEZ JAMAIS la valeur : renseignez-la
    # dans votre .env local ou votre manifeste de déploiement.
    secret: '%env(WAFFLE_AUTH_SECRET)%'
    # Identifiant de tenant estampillé dans chaque assertion sortante (`ten`).
    tenant: 'skeleton'
    jwt:
      # Émetteur et audience attendus des jetons Bearer de la démo (HS256).
      issuer: 'https://waffle-dev.local'
      audience: 'waffle-skeleton'
    # WebAuthn / passkeys (AXE6 / AUTH-01). Le `rp_id` DOIT être un domaine
    # effectif (jamais une origine avec schéma) ; `allowed_origins` liste les
    # origines clientes acceptées (schéma://hôte[:port]). Adaptez à votre domaine
    # de déploiement avant la mise en ligne.
    webauthn:
      rp_id: 'localhost'
      rp_name: 'Waffle Skeleton'
      allowed_origins:
        - 'https://localhost'
    # Hôtes autorisés à recevoir l'assertion sortante X-Wfl-Assert-User via le
    # client HTTP décoré (RFC-021 §4.7). Vide ⇒ aucune propagation sortante.
    assert_hosts: []
  paths:
    controllers: 'src/Controller'
    services: 'src/Service'
    # Résolu sous la racine de l'application, comme controllers et services.
    event_listeners: 'src/EventListener'
  # Cache PSR-16 (RFC-013). Alimente le cache du Router et le futur store CSRF.
  cache:
    adapter: 'redis'                    # array | file | redis
    directory: 'var/cache/psr16'       # résolu par rapport à APP_ROOT (adaptateur file)
    redis_dsn: '%env(REDIS_DSN)%'      # adaptateur redis uniquement
    default_ttl: 3600                  # en secondes, optionnel
    prefix: 'waffle:cache:'            # adaptateur redis uniquement, optionnel
  # Configuration de la base de données locale (RFC-022).
  # Les identifiants sont résolus depuis l'environnement (.env / Docker / K8s).
  # `migrations_path` est relatif à la racine du projet : lancez `bin/waffle
  # db:migrate` depuis cette racine pour que les scripts SQL soient découverts.
  database:
    # PostgreSQL par défaut : le service `waffle-postgres` de docker-compose.yml
    # (postgres:17-alpine) est démarré avec l'application — le squelette est
    # fonctionnel tel quel. `charset` est ignoré par le DSN pgsql (encodage
    # client négocié, UTF8) ; il ne sert qu'aux moteurs MySQL/MariaDB/Oracle.
    driver: 'pgsql'
    host: '%env(DB_HOST)%'
    port: '%env(DB_PORT)%'
    database: '%env(DB_NAME)%'
    username: '%env(DB_USER)%'
    password: '%env(DB_PASSWORD)%'
    charset: 'utf8'
    # BENCH-04 : taille du pool pilotable pour le test de saturation. Interpolée
    # depuis DB_POOL_SIZE (.env / orchestrateur) ; absente ⇒ défaut 8.
    pool_size: '%env(DB_POOL_SIZE)%'
    # [CARRY-01] Fenêtre de fraîcheur du ping, en millisecondes. Une connexion
    # dont la vivacité a été prouvée (à l'ouverture ou par le ping) il y a moins
    # de ce délai repart du pool sans nouveau `SELECT 1` : sous charge, le ping
    # disparaît presque entièrement (deux allers-retours par emprunt sous
    # PostgreSQL). Contrepartie : si la base coupe ses connexions, des requêtes
    # peuvent échouer pendant au plus ce délai ; 0 ⇒ ping à chaque emprunt.
    # Interpolée depuis DB_PING_FRESHNESS_MS ; absente ⇒ défaut 500.
    ping_freshness_ms: '%env(DB_PING_FRESHNESS_MS)%'
    # Délai d'ouverture d'une connexion, en secondes (PostgreSQL, MySQL, MariaDB).
    # Sans lui, une base qui ne répond plus bloque le worker plusieurs minutes, sonde
    # /readyz comprise (RFC-023 §3.2) ; il doit rester plus court que le
    # `timeoutSeconds` de la sonde de disponibilité. Interpolé depuis
    # DB_CONNECT_TIMEOUT ; absent ou invalide ⇒ défaut 2 (le minimum de libpq).
    connect_timeout: '%env(DB_CONNECT_TIMEOUT)%'
    migrations_path: 'migrations'

